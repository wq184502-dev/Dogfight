<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<style>[hidden]{display:none!important}html{color-scheme:dark}body{margin:0;font-size:14px}</style>
<title>바운스 볼</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=Noto+Sans+KR:wght@400;700&display=swap">
<style>
/* Layout: single centered arcade cabinet, HUD above canvas, help below */
:root{
  --bg:#12121F; --panel:#1B1B2F; --fg:#EDEBF5; --muted:#9A98B5; --accent:#FFD166; --danger:#E5484D;
  --display:'Black Han Sans','Noto Sans KR',sans-serif; --body:'Noto Sans KR',system-ui,sans-serif;
  color-scheme:dark;
}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--body);padding-inline:16px;padding-block:16px;display:grid;place-items:center}
.wrap{width:100%;max-width:380px;display:flex;flex-direction:column;gap:10px}
.hud{display:flex;justify-content:space-between;align-items:baseline;font-family:var(--display);font-size:1.25rem;font-variant-numeric:tabular-nums}
.hud small{font-family:var(--body);font-size:.75rem;color:var(--muted);letter-spacing:.08em;margin-right:6px}
.lives{color:var(--danger);letter-spacing:.15em}
.stage{position:relative}
canvas{display:block;width:100%;aspect-ratio:2/3;background:var(--panel);border-radius:10px;touch-action:none;outline:none}
canvas:focus-visible{box-shadow:0 0 0 2px var(--accent)}
.msg{position:absolute;inset:0;display:grid;place-content:center;gap:6px;text-align:center;pointer-events:none;text-shadow:0 2px 10px #000}
.msg b{font-family:var(--display);font-size:2rem;font-weight:400;color:var(--accent);text-wrap:balance}
.msg span{font-size:.9rem;color:var(--fg)}
p{margin:0;text-align:center;font-size:.8rem;color:var(--muted)}
</style>
<div class="wrap">
  <div class="hud"><span><small>점수</small><span id="score">0</span></span><span><small>최고</small><span id="best">0</span></span><span class="lives" id="lives">♥♥♥</span></div>
  <div class="stage">
    <canvas id="c" tabindex="0" aria-label="바운스 볼 게임 화면"></canvas>
    <div class="msg" id="msg"><b>바운스 볼</b><span>탭하거나 스페이스로 발사</span></div>
  </div>
  <p>마우스·터치 또는 ← → 키로 패들 이동</p>
</div>
<script>
(function(){
  var W=360,H=540,PW=80,PH=12,R=8,COLS=6,ROWS=5,BH=20,GAP=4,PY=H-30;
  var COLORS=['#E5484D','#F5A524','#F2D14B','#46A758','#3E63DD'];
  var cv=document.getElementById('c'),ctx=cv.getContext('2d'),dpr=window.devicePixelRatio||1;
  cv.width=W*dpr;cv.height=H*dpr;ctx.scale(dpr,dpr);
  var elScore=document.getElementById('score'),elBest=document.getElementById('best'),elLives=document.getElementById('lives'),elMsg=document.getElementById('msg');
  var best=0;try{best=+localStorage.getItem('bounce-best')||0}catch(e){}
  elBest.textContent=best;
  function makeBricks(){var w=(W-GAP*(COLS+1))/COLS,a=[];for(var r=0;r<ROWS;r++)for(var c=0;c<COLS;c++)a.push({x:GAP+c*(w+GAP),y:50+r*(BH+GAP),w:w,alive:true,c:COLORS[r]});return a}
  var px=W/2-PW/2,bx=0,by=0,vx=0,vy=0,bricks=makeBricks(),score=0,lives=3,state='ready',keys={};
  function hud(){elScore.textContent=score;elLives.textContent='♥'.repeat(Math.max(lives,0))}
  function msg(t,s){elMsg.hidden=!t;if(t)elMsg.innerHTML='<b>'+t+'</b><span>'+s+'</span>'}
  function rest(){bx=px+PW/2;by=PY-R;vx=vy=0}
  function launch(){
    if(state==='over'||state==='win'){bricks=makeBricks();score=0;lives=3;state='ready';hud()}
    if(state==='ready'){var a=(Math.random()*.6-.3)*Math.PI;vx=4*Math.sin(a);vy=-4*Math.cos(a);state='play';msg('')}
  }
  function move(x){var r=cv.getBoundingClientRect();px=Math.max(0,Math.min(W-PW,(x-r.left)/r.width*W-PW/2))}
  cv.addEventListener('pointermove',function(e){move(e.clientX)});
  cv.addEventListener('pointerdown',function(e){move(e.clientX);cv.focus();launch()});
  window.addEventListener('keydown',function(e){keys[e.key]=1;if(e.key===' '||e.key==='Enter'){e.preventDefault();launch()}if(e.key.indexOf('Arrow')===0)e.preventDefault()});
  window.addEventListener('keyup',function(e){delete keys[e.key]});
  function end(s,t){state=s;if(score>best){best=score;elBest.textContent=best;try{localStorage.setItem('bounce-best',best)}catch(e){}}msg(t,'탭하면 다시 시작 · 점수 '+score)}
  function step(){
    if(keys.ArrowLeft)px=Math.max(0,px-7);
    if(keys.ArrowRight)px=Math.min(W-PW,px+7);
    if(state==='play'){
      bx+=vx;by+=vy;
      if(bx<R){bx=R;vx=-vx}if(bx>W-R){bx=W-R;vx=-vx}if(by<R){by=R;vy=-vy}
      if(vy>0&&by+R>=PY&&by+R<=PY+PH+vy&&bx>=px-R&&bx<=px+PW+R){
        var h=(bx-(px+PW/2))/(PW/2),sp=Math.min(Math.hypot(vx,vy)*1.02,9),a=h*Math.PI/3;
        vx=sp*Math.sin(a);vy=-sp*Math.cos(a);by=PY-R;
      }
      for(var i=0;i<bricks.length;i++){var b=bricks[i];if(!b.alive)continue;
        if(bx+R>b.x&&bx-R<b.x+b.w&&by+R>b.y&&by-R<b.y+BH){
          b.alive=false;score+=10;
          var ox=Math.min(bx+R-b.x,b.x+b.w-(bx-R)),oy=Math.min(by+R-b.y,b.y+BH-(by-R));
          if(ox<oy)vx=-vx;else vy=-vy;hud();break}}
      if(bricks.every(function(b){return!b.alive})){rest();end('win','클리어!')}
      else if(by>H+R){lives--;hud();rest();if(lives<=0)end('over','게임 오버');else{state='ready';msg('공을 놓쳤어요','탭하거나 스페이스로 발사')}}
    }else rest();
    ctx.fillStyle='#1B1B2F';ctx.fillRect(0,0,W,H);
    bricks.forEach(function(b){if(b.alive){ctx.fillStyle=b.c;ctx.fillRect(b.x,b.y,b.w,BH)}});
    ctx.fillStyle='#EDEBF5';ctx.fillRect(px,PY,PW,PH);
    ctx.beginPath();ctx.arc(bx,by,R,0,Math.PI*2);ctx.fillStyle='#FFD166';ctx.fill();
    requestAnimationFrame(step);
  }
  hud();rest();requestAnimationFrame(step);
})();
</script>
