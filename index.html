<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<style>[hidden]{display:none!important}html{color-scheme:dark}body{margin:0;font-size:14px}</style>
<title>Dogfight</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=Noto+Sans+KR:wght@400;700&display=swap">
<style>
/* Layout: one arcade cabinet, HUD strip above a 9:16 canvas, help line below */
:root{
  --bg:#0B0F1E; --panel:#111A33; --fg:#EAF0FF; --muted:#8D9AC0; --accent:#FFB347; --danger:#FF5D5D;
  --display:'Black Han Sans','Noto Sans KR',sans-serif; --body:'Noto Sans KR',system-ui,sans-serif;
  color-scheme:dark;
}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--body);padding-inline:16px;padding-block:12px;display:grid;place-items:center}
.wrap{width:100%;max-width:min(400px,calc((100dvh - 90px)*.5625));display:flex;flex-direction:column;gap:8px}
.hud{display:flex;justify-content:space-between;align-items:baseline;font-family:var(--display);font-size:1.1rem;font-variant-numeric:tabular-nums;gap:8px}
.hud small{font-family:var(--body);font-size:.7rem;color:var(--muted);letter-spacing:.08em;margin-right:5px}
.lives{white-space:nowrap}
.hpbar{display:inline-block;width:70px;height:10px;border-radius:5px;background:#3A1B22;vertical-align:middle;overflow:hidden;box-shadow:inset 0 0 0 1px rgba(255,255,255,.18)}
.hpbar i{display:block;height:100%;background:linear-gradient(90deg,#FF5D5D,#FF9A6D)}
.hpbar.low i{background:#FF3D3D;animation:blink .5s steps(2) infinite}
@keyframes blink{50%{opacity:.35}}
.ultbtn{position:absolute;right:56px;bottom:10px;height:38px;padding:0 14px;border-radius:19px;font:700 .85rem var(--body);color:#0B0F1E;background:var(--accent);border:0;cursor:pointer;white-space:nowrap}
.ultbtn.off{opacity:.4;cursor:not-allowed}
.ultbtn:focus-visible{outline:2px solid var(--fg);outline-offset:2px}
.stage{position:relative}
canvas{display:block;width:100%;aspect-ratio:9/16;background:var(--panel);border-radius:10px;touch-action:none;outline:none}
canvas:focus-visible{box-shadow:0 0 0 2px var(--accent)}
.msg{position:absolute;inset:0;display:grid;place-content:center;gap:8px;text-align:center;pointer-events:none;text-shadow:0 2px 10px #000;padding:16px}
.msg b{font-family:var(--display);font-size:2.2rem;font-weight:400;color:var(--accent);text-wrap:balance}
.msg b.warn{color:var(--danger)}
.msg span{font-size:.9rem}
p{margin:0;text-align:center;font-size:.75rem;color:var(--muted)}
.shopbtn{position:absolute;left:50%;bottom:16px;transform:translateX(-50%);font:700 .95rem var(--body);color:#0B0F1E;background:var(--accent);border:0;border-radius:999px;padding:10px 22px;cursor:pointer}
.pausebtn{position:absolute;right:10px;bottom:10px;width:38px;height:38px;border-radius:50%;font:700 .8rem var(--body);color:var(--fg);background:rgba(0,0,0,.45);border:1px solid rgba(255,255,255,.28);cursor:pointer;letter-spacing:-.1em}
.pausebtn:focus-visible{outline:2px solid var(--fg);outline-offset:2px}
.shopbtn:focus-visible,.buy:focus-visible,.close:focus-visible{outline:2px solid var(--fg);outline-offset:2px}
.shop{position:absolute;inset:0;background:var(--panel);border-radius:10px;padding:14px;display:flex;flex-direction:column;gap:10px;overflow:hidden}
.shop header{display:flex;justify-content:space-between;align-items:center;gap:8px}
.shop h2{margin:0;font:400 1.3rem var(--display);color:var(--accent)}
.wallet{font:700 .95rem var(--body);font-variant-numeric:tabular-nums}
.close{font:700 .85rem var(--body);color:var(--fg);background:transparent;border:1px solid var(--muted);border-radius:8px;padding:6px 12px;cursor:pointer}
.note{text-align:left}
.list{display:flex;flex-direction:column;gap:8px;overflow-y:auto;min-height:0;padding-right:2px}
.item{display:grid;grid-template-columns:60px 1fr auto;gap:10px;align-items:center;background:var(--bg);border-radius:10px;padding:8px 10px}
.item.on{box-shadow:inset 0 0 0 2px var(--accent)}
.item canvas{width:60px;height:60px;aspect-ratio:auto;background:transparent;border-radius:0}
.item b{font-size:.95rem}
.item small{display:block;color:var(--muted);font-size:.72rem;margin-top:2px}
.buy{font:700 .8rem var(--body);min-width:76px;border:0;border-radius:8px;padding:8px 10px;cursor:pointer;background:var(--accent);color:#0B0F1E;font-variant-numeric:tabular-nums}
.buy[disabled]{background:#2A3358;color:var(--muted);cursor:not-allowed}
.buy.own{background:transparent;color:var(--fg);box-shadow:inset 0 0 0 1px var(--muted)}
.buy.eq{background:transparent;color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent);cursor:default}
</style>
<div class="wrap">
  <div class="hud"><span><small>점수</small><span id="score">0</span></span><span><small>스테이지</small><span id="stg">1</span></span><span><small>최고</small><span id="best">0</span></span><span class="lives" id="lives"></span></div>
  <div class="stage">
    <canvas id="c" tabindex="0" aria-label="Dogfight 게임 화면"></canvas>
    <div class="msg" id="msg"></div>
    <button class="shopbtn" id="shopbtn" type="button">스킨 상점</button>
    <button class="ultbtn off" id="ultbtn" type="button" hidden>★ 0 · Q</button>
    <button class="pausebtn" id="pausebtn" type="button" aria-label="일시정지" hidden>❚❚</button>
    <section class="shop" id="shop" hidden aria-label="스킨 상점">
      <header><h2>스킨 상점</h2><span class="wallet" id="wallet"></span><button class="close" id="shopclose" type="button">닫기</button></header>
      <p class="note">점수 10점 = 1P · 게임 오버 때 저장돼요</p>
      <div class="list" id="list"></div>
    </section>
  </div>
  <p>화면을 드래그해 이동 · 자동 발사 · 궁극기 Q · 일시정지 P / Esc</p>
</div>
<script>
(function(){
var W=360,H=640;
var cv=document.getElementById('c'),ctx=cv.getContext('2d'),dpr=Math.min(window.devicePixelRatio||1,2);
cv.width=W*dpr;cv.height=H*dpr;ctx.scale(dpr,dpr);
var $=function(i){return document.getElementById(i)};
var elScore=$('score'),elStg=$('stg'),elBest=$('best'),elLives=$('lives'),elMsg=$('msg');
var best=0,wallet=0,owned=[0],skin=0,shopOpen=false;
try{best=+localStorage.getItem('dragon-best')||0;var w2=localStorage.getItem('dragon-wallet2');wallet=w2===null?Math.floor((+localStorage.getItem('dragon-wallet')||0)/10):+w2||0;owned=JSON.parse(localStorage.getItem('dragon-owned2')||'[0]');skin=+localStorage.getItem('dragon-skin2')||0}catch(e){}
if(owned.indexOf(0)<0)owned.push(0);if(owned.indexOf(skin)<0)skin=0;
function save(){try{localStorage.setItem('dragon-wallet2',wallet);localStorage.setItem('dragon-owned2',JSON.stringify(owned));localStorage.setItem('dragon-skin2',skin);localStorage.setItem('dragon-best',best)}catch(e){}}
var SKINS=[
  {n:'불꽃 드래곤',d:'박쥐 날개와 꿈틀대는 꼬리',p:0},
  {n:'F-1 제트',d:'후퇴익과 쌍발 엔진, 미사일 장착',p:400},
  {n:'비행접시',d:'회전하는 조명과 견인 광선',p:900},
  {n:'스텔스 폭격기',d:'날개가 곧 기체인 전익기',p:1600},
  {n:'청룡',d:'구불구불 헤엄치는 동양 용',p:2600},
  {n:'불사조',d:'무지갯빛 불꽃 깃털',p:4500},
  {n:'모기',d:'침을 마구 뱉는 흡혈 전투기',p:3400}
];
var WN=[['화염구','불꽃 분사','화염 미사일'],['기관포','레이저','미사일'],['플라즈마','전격 광선','회전 오브'],['자탄','암흑 빔','폭탄'],['물방울','번개','용 정령'],['불꽃 깃털','무지개 빔','아기 불사조'],['침 뱉기','독침','새끼 모기']];
var HCS=['#FFB347','#FFF1A8','#7CFFB2','#B58CFF','#5CD6FF','#FF9A6D','#B8E03A'];
elBest.textContent=best;
var rnd=function(a,b){return a+Math.random()*(b-a)};
var hp=100,ult=1,ultA=null,ultTxt=0,bolts=[],paused=false,rg=[],weapon='S',state='ready',score,stage,px,py,level,inv,fireT,pb,en,eb,pu,fx,boss,spawnLeft,spawnT,bossPending,banner,t,keys={},stars=[];
for(var i=0;i<50;i++)stars.push({x:rnd(0,W),y:rnd(0,H),s:rnd(.5,2.5)});

function msg(title,sub,cls){elMsg.hidden=!title;if(title)elMsg.innerHTML='<b class="'+(cls||'')+'">'+title+'</b><span>'+(sub||'')+'</span>'}
function hud(){elScore.textContent=score;elStg.textContent=stage;elLives.innerHTML='<span class="hpbar'+(hp<=34?' low':'')+'"><i style="width:'+Math.max(0,hp)+'%"></i></span>';if(ultBtn){ultBtn.textContent='★ '+ult+' · Q';ultBtn.className='ultbtn'+(ult>0?'':' off')}}
function reset(){paused=false;rg=[];bolts=[];ultA=null;ultTxt=0;ult=1;hp=100;weapon='S';score=0;stage=1;level=1;px=W/2;py=H-90;inv=90;fireT=0;pb=[];en=[];eb=[];pu=[];fx=[];boss=null;t=0;startStage();hud()}
function startStage(){spawnLeft=10+stage*4;spawnT=60;bossPending=false;banner=90;boss=null;bgStart(stage);hud()}
function boom(x,y,n,c){for(var i=0;i<n;i++){var a=rnd(0,6.28),s=rnd(.5,4);fx.push({x:x,y:y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,l:rnd(20,40),c:c})}}
var HC={S:'#FFD27A',L:'#9FE8FF',H:'#FF9AD8'};
function impact(b,tg){
  var c=HCS[b.sk||0],n=b.k==='H'?14:4,i,a,v;
  if(fx.length<350)for(i=0;i<n;i++){a=rnd(0,6.28);v=rnd(1,b.k==='H'?4.5:3);fx.push({x:b.x,y:b.y,vx:Math.cos(a)*v,vy:Math.sin(a)*v,l:rnd(10,22),c:i%2?c:'#FFF'})}
  rg.push({x:b.x,y:b.y,r:3,l:12,c:c,g:b.k==='H'?2.6:1.4});
  tg.flash=5;
}
function hit(a,b,r){var dx=a.x-b.x,dy=a.y-b.y;return dx*dx+dy*dy<r*r}
function addScore(n){score+=n;wallet+=Math.round(n/10);elScore.textContent=score}

function makeEnemy(type,x,y){
  var hpT=[2,3,6+stage,1,4,8+stage],rT=[13,13,18,10,15,17];
  en.push({x:x,x0:x,y:y,type:type,hp:hpT[type],t:0,f:rnd(30,90),r:rT[type],ph:rnd(0,6)});
}
function spawnEnemy(){
  var pool=[0,0,3];if(stage>=2)pool.push(1,4);if(stage>=3)pool.push(2,5);
  makeEnemy(pool[Math.floor(Math.random()*pool.length)],rnd(30,W-30),-20);
}
function spawnBoss(){
  var hp=45+stage*28;
  boss={x:W/2,y:-80,hp:hp,max:hp,t:0,r:46,ph:0,hue:(stage*57)%360,kind:(stage-1)%3,enter:true};
  msg('');
}
function shoot(o,ang,sp){eb.push({x:o.x,y:o.y,vx:Math.cos(ang)*sp,vy:Math.sin(ang)*sp})}
function aim(o){return Math.atan2(py-o.y,px-o.x)}

function pickW(){return 'SLH'.charAt(Math.floor(Math.random()*3))}
function pickK(){return Math.random()<.45?'P':pickW()}

var THEMES=[
  {top:[11,16,48],bot:[27,42,92],star:1,cloud:0,cc:[255,255,255],neb:0,p:''},
  {top:[59,42,92],bot:[224,122,95],star:.25,cloud:.42,cc:[255,226,226],neb:0,p:''},
  {top:[18,10,46],bot:[58,27,110],star:1,cloud:0,cc:[255,255,255],neb:.55,p:''},
  {top:[28,10,10],bot:[128,32,18],star:.15,cloud:.32,cc:[70,34,34],neb:0,p:'ember'},
  {top:[6,40,61],bot:[15,110,140],star:.4,cloud:0,cc:[255,255,255],neb:0,p:'snow'}
];
var bg={cur:JSON.parse(JSON.stringify(THEMES[0])),from:null,to:THEMES[0],k:1,p:''},clouds=[],blobs=[],bp=[];
for(var ci=0;ci<8;ci++)clouds.push({x:rnd(0,W),y:rnd(0,H),s:rnd(.8,1.7),sp:rnd(.25,.6)});
blobs=[{x:90,y:150,c:'255,80,200',sx:.12},{x:270,y:330,c:'80,200,255',sx:-.1},{x:160,y:520,c:'170,110,255',sx:.08}];
function bgStart(st){bg.from=JSON.parse(JSON.stringify(bg.cur));bg.to=THEMES[(st-1)%THEMES.length];bg.k=0;bg.p=bg.to.p}
function mixv(a,b,k){return a+(b-a)*k}
function bgStep(){
  if(bg.k<1){
    bg.k=Math.min(1,bg.k+1/300);var e=bg.k*bg.k*(3-2*bg.k);
    ['top','bot','cc'].forEach(function(n){bg.cur[n]=bg.from[n].map(function(v,i){return mixv(v,bg.to[n][i],e)})});
    ['star','cloud','neb'].forEach(function(n){bg.cur[n]=mixv(bg.from[n],bg.to[n],e)});
  }
  clouds.forEach(function(c){c.y+=c.sp;if(c.y>H+60){c.y=-60;c.x=rnd(0,W)}});
  blobs.forEach(function(b){b.x+=b.sx;if(b.x<-40||b.x>W+40)b.sx=-b.sx});
  if(bg.p&&bg.k>.2&&bp.length<110&&Math.random()<.4){
    if(bg.p==='ember')bp.push({x:rnd(0,W),y:H+5,vx:rnd(-.3,.3),vy:-rnd(.6,1.8),r:rnd(1,2.6),t:'e'});
    else bp.push({x:rnd(0,W),y:-5,vx:rnd(-.4,.4),vy:rnd(.6,1.6),r:rnd(1,2.6),t:'s'});
  }
  bp.forEach(function(q){q.x+=q.vx;q.y+=q.vy});
  bp=bp.filter(function(q){return q.y>-10&&q.y<H+10});
}
function rgb(a,al){return 'rgba('+a.map(Math.round).join(',')+','+(al===undefined?1:al)+')'}
function drawBg(){
  var c=bg.cur,g=ctx.createLinearGradient(0,0,0,H);
  g.addColorStop(0,rgb(c.top));g.addColorStop(1,rgb(c.bot));ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
  if(c.neb>.01)blobs.forEach(function(b){var rg2=ctx.createRadialGradient(b.x,b.y,0,b.x,b.y,170);rg2.addColorStop(0,'rgba('+b.c+','+(c.neb*.55)+')');rg2.addColorStop(1,'rgba('+b.c+',0)');ctx.fillStyle=rg2;ctx.fillRect(0,0,W,H)});
  if(c.star>.01){ctx.fillStyle='#C8D2F0';stars.forEach(function(s){ctx.globalAlpha=s.s/3*c.star;ctx.fillRect(s.x,s.y,s.s,s.s*2)});ctx.globalAlpha=1}
  if(c.cloud>.01){ctx.fillStyle=rgb(c.cc,c.cloud);clouds.forEach(function(k){var w=46*k.s;ctx.beginPath();ctx.ellipse(k.x,k.y,w,w*.32,0,0,6.3);ctx.ellipse(k.x-w*.55,k.y+w*.08,w*.6,w*.26,0,0,6.3);ctx.ellipse(k.x+w*.6,k.y+w*.1,w*.65,w*.24,0,0,6.3);ctx.fill()})}
  bp.forEach(function(q){ctx.fillStyle=q.t==='e'?'rgba(255,'+Math.round(120+q.y/H*100)+',40,'+(.35+.4*Math.abs(Math.sin(q.y*.05)))+')':'rgba(255,255,255,.75)';ctx.beginPath();ctx.arc(q.x,q.y,q.r,0,6.3);ctx.fill()});
}
var REP=[['snipe','beam','wall','summon','ring'],['charge','spiral','wall','orbs','snipe'],['orbs','ring','beam','summon','spiral']];
var PN={snipe:'저격',beam:['화염 브레스','집중 광선','저주 광선'],wall:'탄막 벽',summon:'부하 소환',ring:'링 폭발',spiral:'회오리',orbs:'추적 구체',charge:'돌진'};
function patEnd(b){b.pat=null;b.free=false;b.cd=Math.max(40,80-stage*6)-(b.hp/b.max<.5?15:0)}
function bossAI(b,sx,sy){
  var p2=b.hp/b.max<.5,i,T,pt;
  if(b.pn>0)b.pn--;
  if(!b.pat){
    if(b.cd===undefined)b.cd=60;
    if(--b.cd<=0){
      var list=REP[b.kind].slice(0,Math.min(5,2+stage));
      var cand=list.filter(function(n){return n!==b.last&&n!==b.last2});
      var n=cand[Math.floor(Math.random()*cand.length)];
      b.last2=b.last;b.last=n;b.pat={n:n,t:0};
      b.pname=n==='beam'?PN.beam[b.kind]:PN[n];b.pn=90;
    }
    return;
  }
  pt=b.pat;T=pt.t++;
  if(pt.n==='snipe'){
    if(T===20||T===45||T===70){var a=aim(b);shoot(b,a,3.3);if(p2){shoot(b,a-.2,3);shoot(b,a+.2,3)}}
    if(T>=95)patEnd(b);
  }else if(pt.n==='spiral'){
    if(T<150&&T%6===0)for(i=0;i<3;i++)shoot(b,T*.12+i*2.094,2);
    if(T>=165)patEnd(b);
  }else if(pt.n==='beam'){
    if(T===0){pt.x=px;pt.x2=(p2&&Math.abs(W-px-px)>90)?W-px:null}
    if(T>=95)patEnd(b);
  }else if(pt.n==='wall'){
    if(T===0||T===50||(p2&&T===100)){
      var g=T===0?rnd(90,W-90):Math.max(90,Math.min(W-90,pt.g+(Math.random()<.5?-1:1)*110));
      pt.g=g;
      for(var x=12;x<W;x+=26)if(Math.abs(x-g)>52)eb.push({x:x,y:b.y+30,vx:0,vy:1.9});
    }
    if(T>=150)patEnd(b);
  }else if(pt.n==='summon'){
    if(T===15){var c=p2?4:3;for(i=0;i<c;i++)makeEnemy(stage>=3&&i===1?4:3,Math.max(20,Math.min(W-20,b.x+(i-(c-1)/2)*50)),b.y+40)}
    if(T>=60)patEnd(b);
  }else if(pt.n==='ring'){
    if(T===0||T===35||(p2&&T===70)){var o=T*.005;for(i=0;i<16;i++)shoot(b,o+i*6.283/16,2)}
    if(T>=100)patEnd(b);
  }else if(pt.n==='orbs'){
    if(T===10){var ks=p2?[-1,0,1]:[-1,1];ks.forEach(function(k){eb.push({x:b.x+k*30,y:b.y+20,vx:k*.8,vy:1.4,h:1,life:220,hp:3,r:9})})}
    if(T>=40)patEnd(b);
  }else{ // charge
    if(T===0){pt.tx=px;pt.ph=0;b.free=true}
    if(pt.ph===0){b.x+=(pt.tx-b.x)*.08;b.y+=(sy-b.y)*.1;if(T%10<5)b.flash=2;if(T>=55)pt.ph=1}
    else if(pt.ph===1){b.x+=(pt.tx-b.x)*.12;b.y+=6.5;if(b.y>=H-210)pt.ph=2}
    else{b.y-=3.2;b.x+=(sx-b.x)*.04;if(b.y<=sy+2)patEnd(b)}
  }
}
function beamOn(b){return b&&b.pat&&b.pat.n==='beam'&&b.pat.t>=51&&b.pat.t<86}
function heal(n){hp=Math.min(100,hp+n);boom(px,py,14,'#FF9AB0');hud()}
var ULTN=['드래곤 브레스','미사일 일제사격','전자기 펄스','융단 폭격','청룡의 뇌우','불사조 강림','흡혈 모기떼'];
var ULTD=[100,40,60,80,80,85,30];
function hurtE(e,d){e.hp-=d;e.flash=5;if(fx.length<350)fx.push({x:e.x,y:e.y,vx:rnd(-2,2),vy:rnd(-2,2),l:14,c:'#FFF'})}
function bossOk(){return boss&&!boss.dead&&!boss.enter}
function hurtB(f){if(bossOk()){boss.hp-=boss.max*f;boss.flash=5}}
function dist(a,b){return Math.hypot(a.x-b.x,a.y-b.y)}
function inCone(x,y,r){return y<py&&Math.abs(x-px)<34+(py-y)*.28+(r||0)}
function useUlt(){
  if(state!=='play'||paused||ultA||ult<=0)return;
  ult--;ultA={sk:skin,t:0,ex:[]};eb=[];ultTxt=80;
  inv=Math.max(inv,ULTD[skin]+40);hud();
}
function ultUpdate(){
  var u=ultA,T=u.t++,i,x,y,tg,c;
  inv=Math.max(inv,6);
  if(u.sk===0){

    ctx.textAlign='right';ctx.fillText(Math.ceil(fr*100)+'%',W-20,19);
    ctx.fillStyle='#2A1218';ctx.fillRect(20,23,W-40,7);
    ctx.fillStyle=boss.flash>0?'#FFFFFF':fr<.25?'#FF9A3D':'#FF5D5D';ctx.fillRect(20,23,(W-40)*fr,7);
  }
  pb.forEach(drawBullet);
  eb.forEach(function(b){
    if(b.h){var pu2=b.r+Math.sin(t*.3)*1.5;ctx.fillStyle='rgba(197,140,255,.35)';ctx.beginPath();ctx.arc(b.x,b.y,pu2+5,0,6.3);ctx.fill();ctx.fillStyle='#A855F7';ctx.beginPath();ctx.arc(b.x,b.y,pu2,0,6.3);ctx.fill();ctx.fillStyle='#F3E8FF';ctx.beginPath();ctx.arc(b.x,b.y,pu2*.4,0,6.3);ctx.fill();return}
    ctx.fillStyle='#FF5D9E';ctx.beginPath();ctx.arc(b.x,b.y,4.5,0,6.3);ctx.fill();ctx.fillStyle='#FFF';ctx.beginPath();ctx.arc(b.x,b.y,2,0,6.3);ctx.fill()});
  if(boss&&boss.pat&&boss.pat.n==='beam'){
    var bt=boss.pat.t,bc=['#FF8A2E','#5CD6FF','#B58CFF'][boss.kind],xs=boss.pat.x2===null?[boss.pat.x]:[boss.pat.x,boss.pat.x2];
    xs.forEach(function(bx){
      if(bt<51){ctx.globalAlpha=.25+.3*Math.abs(Math.sin(bt*.4));ctx.fillStyle='#FF5D5D';ctx.fillRect(bx-1.5,boss.y+20,3,H);ctx.beginPath();ctx.moveTo(bx-8,boss.y+34);ctx.lineTo(bx+8,boss.y+34);ctx.lineTo(bx,boss.y+48);ctx.fill();ctx.globalAlpha=1}
      else if(bt<86){var w=bt>80?(86-bt)/6:1;ctx.globalAlpha=.5*w;ctx.fillStyle=bc;ctx.fillRect(bx-20*w,boss.y+20,40*w,H);ctx.globalAlpha=.95*w;ctx.fillRect(bx-13*w,boss.y+20,26*w,H);ctx.fillStyle='#FFF';ctx.fillRect(bx-5*w,boss.y+20,10*w,H);ctx.globalAlpha=1}
    });
  }
  drawUlt();
  if(ultTxt>0&&ultA){ctx.globalAlpha=Math.min(1,ultTxt/25);ctx.fillStyle='#FFD166';ctx.strokeStyle='rgba(0,0,0,.6)';ctx.lineWidth=4;ctx.font='400 30px "Black Han Sans",sans-serif';ctx.textAlign='center';ctx.strokeText(ULTN[ultA.sk],W/2,H/2-60);ctx.fillText(ULTN[ultA.sk],W/2,H/2-60);ctx.globalAlpha=1}
  if(boss&&!boss.dead&&boss.pn>0){ctx.globalAlpha=Math.min(1,boss.pn/20);ctx.fillStyle='#FFF';ctx.font='700 13px sans-serif';ctx.textAlign='center';ctx.fillText('⚠ '+boss.pname,W/2,52);ctx.globalAlpha=1}
  if(state==='play'||state==='ready'){
    if(!(inv>0&&Math.floor(t/4)%2))drawShip(ctx,px,py,skin,t,1);
    if(inv>0&&Math.floor(t/4)%2===0){ctx.strokeStyle='#7CFFB2';ctx.globalAlpha=.5;ctx.beginPath();ctx.arc(px,py,24,0,6.3);ctx.stroke();ctx.globalAlpha=1}
  }
  rg.forEach(function(r){ctx.globalAlpha=r.l/12;ctx.strokeStyle=r.c;ctx.lineWidth=2;ctx.beginPath();ctx.arc(r.x,r.y,r.r,0,6.3);ctx.stroke()});ctx.globalAlpha=1;
  fx.forEach(function(p){ctx.globalAlpha=Math.min(1,p.l/20);ctx.fillStyle=p.c;ctx.fillRect(p.x-2,p.y-2,4,4)});ctx.globalAlpha=1;
  if(state==='play'){ctx.fillStyle='#7CFFB2';ctx.font='700 12px sans-serif';ctx.textAlign='left';ctx.fillText(WN[skin]['SLH'.indexOf(weapon)]+' Lv.'+level,10,H-24)}
  if(state==='play'&&!paused&&banner>0&&!bossPending&&!boss&&stage>=1&&spawnLeft>0){ctx.fillStyle='#FFB347';ctx.font='400 28px "Black Han Sans",sans-serif';ctx.textAlign='center';ctx.globalAlpha=Math.min(1,banner/30);ctx.fillText('STAGE '+stage,W/2,H/2-40);ctx.globalAlpha=1}
}

var shopBtn=$('shopbtn'),shopEl=$('shop'),listEl=$('list'),walletEl=$('wallet');
function preview(cv,i){var c=cv.getContext('2d');c.clearRect(0,0,60,60);drawShip(c,30,29,i,shopT,.72)}
var shopT=0,shopRaf=0;
function renderShop(){
  walletEl.textContent=wallet+' P';
  listEl.innerHTML='';
  SKINS.forEach(function(K,i){
    var has=owned.indexOf(i)>=0,eq=skin===i,row=document.createElement('div');
    row.className='item'+(eq?' on':'');
    var cv=document.createElement('canvas');cv.width=60;cv.height=60;cv.setAttribute('data-i',i);
    var mid=document.createElement('div');mid.innerHTML='<b>'+K.n+'</b><small>'+K.d+'</small><small>무기 · '+WN[i].join(' / ')+'</small>';
    var b=document.createElement('button');b.type='button';b.className='buy';
    if(eq){b.textContent='장착 중';b.className+=' eq';b.disabled=true}
    else if(has){b.textContent='장착';b.className+=' own'}
    else{b.textContent=K.p+' P';b.disabled=wallet<K.p}
    b.addEventListener('click',function(){
      if(!has){if(wallet<K.p)return;wallet-=K.p;owned.push(i)}
      skin=i;save();renderShop();
    });
    row.appendChild(cv);row.appendChild(mid);row.appendChild(b);listEl.appendChild(row);
  });
}
function shopLoop(){
  if(!shopOpen)return;
  shopT++;
  var cs=listEl.querySelectorAll('canvas');for(var i=0;i<cs.length;i++)preview(cs[i],+cs[i].getAttribute('data-i'));
  shopRaf=requestAnimationFrame(shopLoop);
}
function openShop(){shopOpen=true;shopEl.hidden=false;renderShop();shopLoop()}
function closeShop(){shopOpen=false;shopEl.hidden=true;save();syncBtn()}
var pauseBtn=$('pausebtn'),ultBtn=$('ultbtn');
function syncBtn(){shopBtn.hidden=state==='play'||shopOpen;pauseBtn.hidden=state!=='play';ultBtn.hidden=state!=='play';pauseBtn.textContent=paused?'▶':'❚❚';pauseBtn.setAttribute('aria-label',paused?'계속하기':'일시정지')}
function togglePause(){
  if(state!=='play')return;
  paused=!paused;keys={};down=false;
  if(paused)msg('일시정지','탭하거나 P · Esc 로 계속<br>점수 '+score+' · 스테이지 '+stage);
  else{msg('');acc=0;last=performance.now()}
  syncBtn();
}
pauseBtn.addEventListener('click',togglePause);
ultBtn.addEventListener('click',useUlt);
window.addEventListener('blur',function(){if(state==='play'&&!paused)togglePause()});
shopBtn.addEventListener('click',openShop);
$('shopclose').addEventListener('click',closeShop);
window.addEventListener('pagehide',save);
document.addEventListener('visibilitychange',function(){if(document.hidden){save();if(state==='play'&&!paused)togglePause()}});
function start(){if(state==='play'||shopOpen)return;reset();state='play';msg('');syncBtn()}
var last=0,acc=0,down=false,lx=0,ly=0;
function loop(now){
  acc+=Math.min(now-last,100);last=now;
  while(acc>=16.667){if(!paused)update();acc-=16.667}
  draw();requestAnimationFrame(loop);
}
function scale(){return W/cv.getBoundingClientRect().width}
cv.addEventListener('pointerdown',function(e){if(paused){togglePause();return}cv.focus();cv.setPointerCapture(e.pointerId);down=true;lx=e.clientX;ly=e.clientY;start()});
cv.addEventListener('pointermove',function(e){
  if(state!=='play'||paused)return;
  var k=scale();
  if(e.pointerType==='mouse'){var r=cv.getBoundingClientRect();px=(e.clientX-r.left)*k;py=(e.clientY-r.top)*k-30}
  else if(down){px+=(e.clientX-lx)*k*1.3;py+=(e.clientY-ly)*k*1.3;lx=e.clientX;ly=e.clientY}
});
cv.addEventListener('pointerup',function(){down=false});
window.addEventListener('keydown',function(e){if(e.code==='KeyP'||e.key==='Escape'){togglePause();return}if(e.code==='KeyQ'){useUlt();return}if(paused)return;keys[e.key]=1;if(e.key===' '||e.key==='Enter')start();if(e.key.indexOf('Arrow')===0||e.key===' ')e.preventDefault()});
window.addEventListener('keyup',function(e){delete keys[e.key]});

reset();state='ready';
msg('Dogfight','탭하거나 스페이스로 출격<br>보유 '+wallet+'P · 매 스테이지 끝에 보스 등장');syncBtn();
requestAnimationFrame(function(n){last=n;loop(n)});
})();
</script>
